<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Fake Lag · אדמין</title>
<link rel="stylesheet" href="admin-ui.css">
<style>
  :root{--bg:#101216;--card:#191c22;--line:#2a2e37;--ink:#eef0f3;--mute:#9aa1ad;--accent:#ff5a5a;--ok:#46d388}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding:16px;max-width:760px;margin-inline:auto}
  h1{font-size:19px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  h1 button{margin-inline-start:auto}
  .note{color:var(--mute);font-size:12.5px}
  .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  button{font:inherit;font-size:14px;border-radius:9px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:none;color:var(--ink)}
  button.ok{background:var(--ok);border-color:var(--ok);color:#06210f;font-weight:600}
  canvas{width:100%;aspect-ratio:16/9;border-radius:12px;background:#000;border:1px solid var(--line)}
  .pv{position:sticky;top:0;z-index:2;background:var(--bg);padding-bottom:6px}
  #key{font:inherit;width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:#0d0f13;color:var(--ink);direction:ltr}
  #login,#app{display:none}
  .pv canvas{display:block;height:min(30vh,260px);width:auto;max-width:100%;margin-inline:auto}
</style>
</head>
<body>
<div id="login">
  <h1>Fake Lag · אדמין</h1>
  <p class="note">הדבק את קוד האדמין. הוא נשמר רק בלשונית הזו עד שסוגרים אותה.</p>
  <input id="key" type="password" autocomplete="off">
  <div class="btns"><button class="ok" id="go">כניסה</button></div>
  <p class="note" id="loginMsg"></p>
</div>
<div id="app">
  <h1>Fake Lag · אדמין <button id="logout">יציאה</button></h1>
  <div class="pv">
    <canvas id="pv" width="640" height="360"></canvas>
    <div class="btns"><button id="cam">📷 להשתמש במצלמה</button><small class="note" id="pvNote">לחץ "▶ תצוגה" על פריט כדי לראות אותו.</small></div>
  </div>
  <div id="panel"></div>
</div>
<script src="schema.js"></script>
<script src="effects.js"></script>
<script src="admin-ui.js"></script>
<script src="admin.js"></script>
</body>
</html>
