<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101216">
<title>Fake Lag</title>
<style>
  :root{--bg:#101216;--card:#191c22;--line:#2a2e37;--ink:#eef0f3;--mute:#9aa1ad;--accent:#ff5a5a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;
       padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
  h1{font-size:18px;margin:0 0 12px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;
         padding:18px 12px;text-align:start;min-height:72px;touch-action:manipulation}
  button small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
  button.on{border-color:var(--accent);background:#2a171a}
  .wide{grid-column:1/-1}
  .danger{background:#2b1414;border-color:#4a2020}
  label{display:block;margin:18px 0 0;color:var(--mute);font-size:14px}
  input{width:100%;accent-color:var(--accent);height:32px}
  #lost{display:none;margin-top:14px;color:#ffb547;font-size:14px}
</style>
</head>
<body>
<h1 data-i18n="app"></h1>
<div class="grid" id="g"></div>
<label><span data-i18n="level"></span> <b id="lv"></b><input id="lvl" type="range" min="0" max="1" step="0.05"></label>
<div id="lost" data-i18n="r_lost"></div>
<script src="/i18n.js"></script>
<script>
const LANG = '__LANG__', t = T(LANG), K = new URLSearchParams(location.search).get('k');
applyI18n(LANG);
const M = [['live'], ['lag'], ['low'], ['mosh'], ['freeze'], ['black'], ['auto', 'wide danger'], ['reconnect', 'wide']];
const g = document.getElementById('g');
g.innerHTML = M.map(([m, c = '']) => `<button class="${c}" data-m="${m}">${t('m_' + m)}<small>${t('d_' + m)}</small></button>`).join('');
const send = c => fetch('/cmd?k=' + encodeURIComponent(K), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(c) });
g.onclick = e => { const b = e.target.closest('button'); if (b) { send({ t: 'mode', mode: b.dataset.m }); navigator.vibrate && navigator.vibrate(15); } };
const lvl = document.getElementById('lvl'), lv = document.getElementById('lv'), lost = document.getElementById('lost');
lvl.oninput = () => { lv.textContent = Math.round(lvl.value * 100) + '%'; send({ t: 'level', level: +lvl.value }); };
const es = new EventSource('/events?k=' + encodeURIComponent(K));
es.onmessage = e => {
  const s = JSON.parse(e.data); lost.style.display = 'none';
  g.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === s.mode));
  if (document.activeElement !== lvl) { lvl.value = s.level; lv.textContent = Math.round(s.level * 100) + '%'; }
};
es.onerror = () => { lost.style.display = 'block'; };
</script>
</body>
</html>
