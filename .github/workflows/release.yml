# Push a tag like v0.1.0 and GitHub builds the Windows installer and publishes it as a release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # GitHub's download servers sometimes answer 504 for a few minutes: try again instead of failing the release
      - name: install
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            npm ci && exit 0
            echo "npm ci failed (try $i), waiting"; sleep $((i * 30))
          done
          exit 1
      - name: build
        shell: bash
        run: |
          for i in 1 2 3 4; do
            npm run dist && exit 0
            echo "build failed (try $i), waiting"; sleep $((i * 45))
          done
          exit 1
      - name: publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/FakeLag-Setup.exe \
            --title "Fake Lag ${GITHUB_REF_NAME#v}" \
            --notes-file ../.github/release-notes.md
